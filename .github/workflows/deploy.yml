# AWS 배포 (TIL AWS배포환경/templates/deploy.yml 기반)
# push → 테스트 → arm64 이미지 빌드 → ECR → SSM으로 서버의 /usr/local/bin/deploy-app 실행
# 서버 설정(/srv/clearing-hub/docker-compose.yml, .env, sim.env)은 docs/DEPLOY.md
name: deploy

on:
  push:
    branches: [main]
    # 문서만 바뀐 push는 배포하지 않는다 (서버 이미지에 영향이 없다).
    # 문서와 코드가 함께 바뀌면 그대로 배포된다. SPEC의 빠른 시작 코드는 tests/test_quickstart.py가 확인하므로
    # SPEC만 고쳤을 때는 로컬에서 그 테스트를 돌린다. 필요하면 Actions의 Run workflow(workflow_dispatch)로 직접 배포한다
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

# OIDC로 임시 자격증명을 받는다 (장기 액세스 키 없음)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  APP_NAME: clearing-hub           # ECR 리포지토리 = 서버의 /srv/<이름> = 컨테이너 이름
  INSTANCE_ID: i-05ee0665bbba15a52

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # 네이티브 arm64 러너 (퍼블릭 저장소는 무료). 서버가 Graviton(arm64)이다
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # 돈이 오가는 서버라 테스트가 깨지면 배포하지 않는다 (SQLite, 외부 의존 없음)
      - uses: astral-sh/setup-uv@v6
      - name: 테스트
        run: uv run pytest -q

      - name: AWS 자격증명 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::403187831140:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 빌드 & ECR 푸시
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$APP_NAME"
          docker build --platform linux/arm64 -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: SSM으로 배포
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy $APP_NAME" \
            --parameters "commands=[\"/usr/local/bin/deploy-app $APP_NAME $SHA\"]" \
            --query "Command.CommandId" --output text)
          echo "CommandId: $CMD_ID"

          sleep 5
          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2
          echo "---------------------"

          # 이 체크가 없으면 서버에서 실패해도 워크플로가 초록색으로 뜬다
          if [ "$STATUS" != "Success" ]; then
            echo "배포 실패: $STATUS"
            exit 1
          fi
          echo "배포 성공"
